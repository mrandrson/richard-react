<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Opening Richard Anderson | Physics</title>
    <script>
      (function redirectToSpa(location) {
        var pathSegmentsToKeep = 1;
        var basePath = location.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
        var routePath = location.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
        var query = location.search ? '&' + location.search.slice(1).replace(/&/g, '~and~') : '';

        location.replace(
          location.protocol +
            '//' +
            location.hostname +
            (location.port ? ':' + location.port : '') +
            basePath +
            '/?/' +
            routePath +
            query +
            location.hash,
        );
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
